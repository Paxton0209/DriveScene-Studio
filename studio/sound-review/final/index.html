<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DriveScene · 开启音效选择</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f3f6;color:#20252d;font:15px/1.6 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:1040px;margin:72px auto;padding:0 28px}h1{font-size:28px;letter-spacing:-.7px;margin:0 0 8px}p{color:#75808f}section{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:36px 0}article{background:white;border:1px solid #e0e5ec;border-radius:16px;padding:26px}h2{font-size:18px;margin:20px 0 8px}small{display:block;color:#76818e;font-size:13px;min-height:63px}.wave{height:60px;display:flex;align-items:center;gap:5px;color:#2387ed}.wave i{height:var(--h);width:4px;background:currentColor;border-radius:3px}button{border:0;cursor:pointer;border-radius:9px;font:inherit;padding:11px 17px;background:#edf3fa;color:#1b6bc3;margin-top:12px;width:100%}.select{background:#167ff0;color:white}button:focus-visible{outline:3px solid #89c1ff;outline-offset:3px}article[data-selected=true]{border-color:#53a0f1;background:#f6faff}a{color:#76818e;font-size:12px}label{display:flex;gap:16px;align-items:center}#status{min-height:25px;color:#27659d}@media(max-width:700px){main{margin:30px auto}section{grid-template-columns:1fr}small{min-height:0}}</style><main><h1>开启提示音</h1><p>短钢琴和弦：三音与四音，控制在约半秒。保留特斯拉作为对照。先试听，再选择。</p><label>试听音量<input type="range" min="0" max="1" step=".01" value=".55" id="volume"></label><section id="choices"></section><p id="status" role="status">当前保留原工作台音效</p><a href="../08/">查看之前的音效方案</a></main><audio id="player"></audio><script type="module" src="choose.js?v=4"></script></html>
