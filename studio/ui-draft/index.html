<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>DriveScene Studio · UI draft</title><link rel="stylesheet" href="draft.css?v=final-12">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('sr-ui-draft-theme')||'light'}catch{}</script>
</head><body><div id="app">
<header class="toolbar"><span class="project-name">DriveScene Studio</span><button id="theme" class="icon-button" aria-label="Switch to dark theme" data-tip="Appearance"></button></header>
<div class="workspace">
<nav id="scene-nav" aria-label="Scenes"></nav>
<main id="stage" aria-label="Scene canvas"><div id="artboard">
<div class="artboard-label"><span id="artboard-name"></span><span>1920 × 1080</span></div>
<div class="artboard-clip"><iframe id="engine" title="DriveScene animated scene"></iframe><img id="frame-cover" alt="" hidden><div id="loading" role="status" aria-label="Loading scene" hidden><span class="loading-spinner" aria-hidden="true"></span></div></div>
</div></main>
<aside id="inspector" aria-label="Inspector"><div id="inspector-scroll">
<section class="vehicle-slot">
<div class="vehicle-heading"><h2>Vehicle</h2><span id="vehicle-name">Tesla Model 3</span></div>
<div id="vehicle-strip" class="segment vehicle-strip" role="radiogroup" aria-label="Vehicle"></div>
<button id="assist" role="switch" aria-checked="false" data-tip="Driving assist|A" disabled><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle class="assist-disc" cx="12" cy="12" r="12"/><g class="assist-wheel"><path fill-rule="evenodd" d="M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18Zm0 1.8a7.2 7.2 0 1 0 0 14.4 7.2 7.2 0 0 0 0-14.4Z"/><path d="M4.9 10.9h14.2v1.8c-3.6.2-6.15 2.5-6.15 6.6h-1.9c0-4.1-2.55-6.4-6.15-6.6Z"/></g></svg><span id="assist-label">Driving assist</span></button>
</section>
<section id="scene-settings"><h2 id="scene-group">Road</h2><div id="scene-properties" class="properties"></div></section>
<section><h2>Layers</h2><div id="layers"></div></section>
<section id="export-section"><h2>Export</h2><div class="properties">
<label class="property"><span class="property-label">Format</span><select id="format" aria-label="Export format" data-tip="Scene image PNG"><option value="png">PNG</option><option value="kit">Kit · ZIP</option><option value="camera">Camera · JSON</option><option value="depth">Depth · PNG</option><option value="video">Video · MP4</option></select></label>
<div class="property"><span class="property-label">Size</span><span class="export-size"><span id="image-size">1920 × 1080</span><button id="video-duration" data-tip="Video duration" hidden>· 10s ▾</button></span></div>
</div><button id="export" class="raised" data-tip="Export|⌘E" disabled><span id="export-label">Export</span><span>⌘E</span></button><p id="feedback" role="status" hidden></p></section>
</div></aside></div>
<nav id="debug-links" hidden><a href="../material-draft/">Material draft</a><a href="./sound-ab.html">08 / 09 A/B</a><a href="./review.html">QA</a></nav>
</div><div id="tooltip" role="tooltip" hidden></div><script type="module" src="draft.js?v=final-12"></script></body></html>
