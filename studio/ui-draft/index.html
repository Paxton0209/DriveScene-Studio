:var(--groove)}.segment button{position:relative;z-index:1;flex:1;min-width:0;height:20px;display:grid;place-items:center;border-radius:4px;font-size:12px;font-weight:500;color:var(--muted);line-height:20px}.segment button[aria-checked=true]{color:var(--text)}.segment-indicator{position:absolute;top:0;left:0;border-radius:4px;background:var(--raised);box-shadow:var(--e1);pointer-events:none;transform-origin:0 0}.layer-row{height:26px;display:flex;align-items:center;gap:8px;border-radius:6px;width:100%;text-align:start;font-size:13px;font-weight:400}.layer-row{justify-content:space-between}.layer-row[aria-pressed=false]{color:var(--muted)}#export-section{margin-top:auto;border-top:var(--hairline) solid var(--line);padding:10px 16px 14px}#export-section h2{height:22px;padding:0;margin:0}#image-size{flex:1;font-size:12px;font-weight:400;color:var(--muted);white-space:nowrap}select{height:24px;min-width:0;border-radius:6px;background:var(--track);border:0;box-shadow:var(--groove);font-size:12px;font-weight:500;padding:0 8px;cursor:default}#format{width:104px;text-overflow:ellipsis}#video-duration{flex:1;text-align:start}.raised{height:28px;border-radius:6px;background:var(--raised);box-shadow:var(--e1);font-size:12px;font-weight:500}#export{display:flex;align-items:center;justify-content:space-between;width:100%;position:relative;overflow:hidden}#export>span{z-index:1;padding-inline:8px}#export>span:last-child{color:var(--muted)}#export::before{position:absolute;inset:0;transform:scaleX(var(--progress,0));transform-origin:left;background:var(--selected);content:""}#feedback{font-size:11px;color:var(--muted);margin:8px 0 0;line-height:16px}#tooltip{position:fixed;z-index:100;pointer-events:none;padding:4px 8px;border-radius:6px;background:#28282c;color:#fff;font-size:11px;font-weight:500;line-height:16px;box-shadow:0 10px 30px #0000001a,0 2px 6px #0000000d;white-space:nowrap;user-select:none}#tooltip kbd{font:inherit;opacity:.6;margin-left:8px}#debug-links{display:flex;g
