<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DriveScene · 启动测速</title><link rel="stylesheet" href="test.css"></head><body><main>
<header><h1>启动测速</h1><span id="environment">正在确认测试环境</span></header>
<p class="description">从发起页面加载，到完整场景可操作、导出可用。冷启动每次重新下载资源；不清除浏览器已有的 GPU 缓存，不包含公网 DNS、TLS 和 GitHub 传输时间。</p>
<form id="controls"><label>场景<select id="scene"><option value="road">Road</option><option value="elevated">Elevated</option><option value="ramp">Ramp</option><option value="junction">Junction</option><option value="parking">Indoor parking</option><option value="outdoor">Outdoor parking</option></select></label><label>车模<select id="model"><option value="model-3">Tesla Model 3</option><option value="x6">BMW X6</option><option value="ix">BMW iX</option><option value="xc90">Volvo XC90</option></select></label><button id="cold" type="button">重新冷启动</button><button id="warm" type="button" disabled>缓存后重测</button></form>
<section class="measurement" aria-label="测试结果"><div><span class="label">完整场景就绪</span><div class="number"><strong id="elapsed">—</strong><span>ms</span></div></div><p id="status" role="status">点击“重新冷启动”开始，结果会保留在下方。</p></section>
<p id="phases" class="note"></p><div id="mount"><div class="empty">测试时在这里显示实际页面，可直接切换车模和场景。</div></div>
<details id="history"><summary>测试记录 <span id="count">0</span></summary><div class="table-wrap"><table><thead><tr><th>时间 / 方式</th><th>场景 / 车模</th><th>场景就绪</th><th>关键下载完成</th><th>请求传输量</th></tr></thead><tbody id="rows"></tbody></table></div><p class="note">“关键下载完成”从加载开始计时，包含环境、车模、他车和运行脚本，与场景准备有重叠，不能相加。请求传输量来自浏览器计时记录；缓存命中时可能为 0。</p><button type="button" id="download">下载测试记录</button></details>
</main><script type="module" src="test.js"></script></body></html>
