<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DriveScene · 修改进度</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#222936;font:14px/1.6 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:1120px;margin:auto;padding:36px 28px}h1{font-size:23px;margin:0 0 8px}p{color:#737d8b;margin:0 0 22px}nav{display:flex;gap:20px;margin:20px 0}a{color:#2874be;text-decoration:none}table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}td,th{text-align:left;padding:14px 17px;border-bottom:1px solid #edf0f4}th{font-size:12px;font-weight:500;color:#7a8390}td:first-child{width:45px;color:#8c95a2}td:nth-child(3){width:95px;white-space:nowrap}td:last-child{width:45%;color:#687382;font-size:13px}.state{border-radius:5px;background:#eef1f6;padding:3px 7px;font-size:12px;display:inline-block}.state[data-state="处理中"]{background:#e6f1ff;color:#286aa6}.state[data-state="已验证"]{background:#e7f3eb;color:#35714a}#updated{font-size:12px;margin-top:16px}.count{float:right;font-size:13px;color:#76808d}strong{font-weight:500}footer{color:#87909b;font-size:12px;margin-top:25px}</style><main><h1>DriveScene 修改进度 <span class="count" id="count"></span></h1><p>仅记录本轮反馈。写好代码和实际画面验收分开记录；页面会自动刷新进度。</p><nav><a href="../material-draft/" target="_blank">材质草稿</a><a href="../traffic-review/" target="_blank">他车近景</a></nav><table><thead><tr><th>编号</th><th>反馈项目</th><th>状态</th><th>当前证据 / 下一步</th></tr></thead><tbody id="items"></tbody></table><div id="updated"></div><footer>当前版本 finish-109。改动保存到预览分支，正式发布另行处理。</footer></main><script>async function refresh(){try{const data=await fetch('status.json?t='+Date.now()).then(r=>r.json());document.getElementById('items').replaceChildren(...data.items.map(item=>{const row=document.createElement('tr');for(const value of [item.id,item.title,item.state,item.note]){const td=document.createElement('td');if(value===item.state){const s=document.createElement('span');s.className='state';s.dataset.state=value;s.textContent=value;td.append(s)}else td.textContent=value;row.append(td)}return row}));document.getElementById('count').textContent=data.items.filter(i=>i.state==='已验证').length+' / '+data.items.length+' 已验证';document.getElementById('updated').textContent='更新：'+data.updated;}catch{}}refresh();setInterval(refresh,2500)</script></html>
