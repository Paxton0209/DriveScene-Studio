<!doctype html><html lang="en"><meta charset="utf-8"><title>Prepare vehicle source</title><script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../node_modules/three/examples/jsm/"}}</script><style>body{font:16px/1.6 system-ui;max-width:720px;margin:64px auto;padding:24px}button{font:inherit;padding:12px 20px}code{background:#eee;padding:3px 6px}</style><h1>Prepare vehicle source</h1><p>Run <code>npm install</code>, serve the repository, then use this page to export the fixed source edits. Run <code>npm run prepare:vehicle -- /path/to/vehicle-prepared.glb</code> to generate the compressed delivery model.</p><button>Export prepared GLB</button><p role="status" id="status"></p><script type="module">
import {createSourceVehicle} from '../vehicle.js';import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';
const button=document.querySelector('button'),status=document.querySelector('#status');button.onclick=async()=>{button.disabled=true;status.textContent='Preparing source geometry…';try{const car=await createSourceVehicle(),bytes=await new GLTFExporter().parseAsync(car,{binary:true}),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'model/gltf-binary'}));a.download='vehicle-prepared.glb';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);status.textContent='Prepared GLB download started.';}catch(e){status.textContent=e.message;}finally{button.disabled=false;}};
</script></html>
