const encode=new TextEncoder();function tar(files){let parts=[];for(const {name,bytes} of files){let header=new Uint8Array(512);function put(offset,text){header.set(encode.encode(text),offset);}put(0,name);put(100,'0000644\0');put(108,'0000000\0');put(116,'0000000\0');put(124,bytes.length.toString(8).padStart(11,'0')+'\0');put(136,'00000000000\0');put(148,'        ');put(156,'0');put(257,'ustar\0');put(263,'00');put(148,header.reduce((s,b)=>s+b,0).toString(8).padStart(6,'0')+'\0 ');parts.push(header,bytes,new Uint8Array((512-bytes.length%512)%512));}parts.push(new Uint8Array(1024));return new Blob(parts,{type:'application/x-tar'});}

const a=document.createElement('a');a.href=URL.createObjectURL(tar(files));a.download='startup-states.tar';a.click();status.textContent=`Complete ${files.length}`;}catch(error){status.textContent=error.stack;}finally{button.disabled=false;}};
