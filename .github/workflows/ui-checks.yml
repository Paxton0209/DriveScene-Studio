name: UI checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-ui:
    name: check-ui (changed files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: tokens.css matches the pinned design system
        run: |
          diff -u design-system/tokens/tokens.css studio/ui-draft/design-system/tokens.css \
            || { echo "::error::studio/ui-draft/design-system/tokens.css 与锁定版本的设计系统不一致：从 design-system/tokens/tokens.css 重新复制，不手改"; exit 1; }
      - name: check-ui on changed files only
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then BASE="origin/${{ github.base_ref }}";
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then BASE="${{ github.event.before }}";
          else BASE="HEAD~1"; fi
          node design-system/checks/check-changed.mjs --base "$BASE"

  keypage:
    name: keypage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm ci --prefix design-system/checks
          npx --prefix design-system/checks playwright install --with-deps chromium
      - name: Serve repository
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/studio/ui-draft/ >/dev/null && break; sleep 1; done
      - name: Key page gaps (desktop / phone × light / dark, ±1px)
        timeout-minutes: 18
        shell: bash
        run: |
          mkdir -p work/keypage
          node design-system/checks/keypage.mjs --spec studio/ui-draft/keypage.json --out work/keypage 2>&1 | tee work/keypage/keypage.log
      - name: Summary
        if: always()
        run: |
          if [ -f work/keypage/keypage.log ]; then { echo '### keypage'; echo '```'; cat work/keypage/keypage.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keypage
          path: |
            work/keypage
            /tmp/http.log
          retention-days: 30

  audit:
    # 只出报告、不拦合并：关键页不追溯迁移，审计在既有界面上会有历史问题。
    name: Render audit (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm ci --prefix design-system/checks
          npx --prefix design-system/checks playwright install --with-deps chromium
      - name: Serve repository
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/studio/ui-draft/ >/dev/null && break; sleep 1; done
      - name: Audit workbench
        env:
          DS_BROWSER_ARGS: --use-angle=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist
        # 审计发现的问题只出报告；审计没跑完由下一步报错。
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          mkdir -p work/ui-audit
          node design-system/checks/audit.mjs --url http://127.0.0.1:8000/studio/ui-draft/ --out work/ui-audit 2>&1 | tee work/ui-audit/audit.log
      - name: Audit report was generated
        if: always()
        run: |
          if [ ! -s work/ui-audit/audit.md ]; then
            echo "::error::work/ui-audit/audit.md 未生成，审计没有跑完；日志尾部如下（完整日志见 ui-audit 附件）"
            tail -n 40 work/ui-audit/audit.log 2>/dev/null || echo "(无日志)"
            exit 1
          fi
      - name: Summary
        if: always()
        run: |
          if [ -f work/ui-audit/audit.md ]; then { echo '### audit'; head -c 60000 work/ui-audit/audit.md; } >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-audit
          path: |
            work/ui-audit
            /tmp/http.log
          retention-days: 30
